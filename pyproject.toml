[project]
name = "hass-mytpu"
version = "0.0.0"
requires-python = ">=3.14.2"
description = "A Home Assistant custom component for Tacoma Public Utilities."
authors = [{ name = "Chad Condon", email = "chad@chadcondon.com" }]
readme = "README.md"
license = { file = "LICENSE" }

dependencies = ["aiohttp>=3.8.0"]

[project.urls]
Homepage = "https://github.com/thetic/hass-mytpu"
Repository = "https://github.com/thetic/hass-mytpu"
"Issue Tracker" = "https://github.com/thetic/hass-mytpu/issues"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant>=0.1.3",
    "freezegun>=1.4.0",
    "ruff",
    "ty",
]

[tool.ruff]
# The integration still supports Home Assistant releases running Python 3.13;
# requires-python is higher only because the test dependencies need it.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = [
    # Let Home Assistant install its httpx alias before respx is imported.
    "-p no:respx",
    "--cov=custom_components/mytpu",
    "--cov-report=term-missing",
    "-W error",
    "-W ignore::ResourceWarning",
    "-W ignore::pytest.PytestUnraisableExceptionWarning",
    # Raised while Home Assistant imports, before filterwarnings applies.
    "-W ignore:Inheritance class HomeAssistantApplication:DeprecationWarning",
    "-W ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/mytpu"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
